# Local development services. Credentials are dev-only defaults; override via infra/.env.
name: ai-proctor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proctor}
      POSTGRES_DB: ${POSTGRES_DB:-proctor}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes community images to Docker Hub/Quay; Chainguard rebuilds
  # from upstream source daily (free tier only offers :latest). The image ships `mc` too.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-proctor-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-proctor-minio-secret}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the private evidence bucket, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-proctor-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-proctor-minio-secret}
      EVIDENCE_BUCKET: ${EVIDENCE_BUCKET:-evidence}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${EVIDENCE_BUCKET} &&
      mc anonymous set none local/$${EVIDENCE_BUCKET}
      "
    restart: 'no'

volumes:
  pgdata:
  miniodata:
